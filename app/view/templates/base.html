<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}BdfDiff{% endblock %}</title>
  <!-- Bootstrap 5 CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('main.index') }}">
      <i class="bi bi-file-diff"></i> BdfDiff
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-3">
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('main.index') }}">
            <i class="bi bi-house"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('main.diff_upload') }}">
            <i class="bi bi-upload"></i> Upload &amp; Diff
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{{ url_for('main.diff_commits') }}">
            <i class="bi bi-git"></i> Git Diff
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Main content -->
<div class="container-fluid py-4">
  {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer class="text-center text-muted py-3 border-top">
  <small>BdfDiff &mdash; Nastran BDF Visual Diff Tool</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/diff.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
